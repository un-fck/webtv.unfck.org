# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - un-transcripts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Gate: run the full CI suite (typecheck + test + lint) before building or
  # deploying. A red gate skips build + deploy, so only green commits ship.
  test:
    uses: ./.github/workflows/test.yml

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: transcripts.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_ECA1F648571042B1AE467ADD6BD1040A }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_F63B0D7E377943F0AADB64723DEB4F3A }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: transcripts.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_ECA1F648571042B1AE467ADD6BD1040A }}/transcripts:${{ github.sha }}
          file: ./Dockerfile
          # NEXT_PUBLIC_SENTRY_DSN is inlined into the client bundle at build
          # time, so it must be passed here (not just set in the Azure runtime
          # env) or the browser Sentry SDK + feedback widget stay disabled. The
          # SENTRY_* auth args enable source-map upload during the build.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'un-transcripts'
          slot-name: 'Production'
          images: 'transcripts.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_ECA1F648571042B1AE467ADD6BD1040A }}/transcripts:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8090365B38B7416FBE447AF2CEEA4AF3 }}