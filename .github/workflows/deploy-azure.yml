name: Deploy to Azure Container Apps

# Builds the Docker image, pushes to Azure Container Registry, and updates
# the Container App revision. Triggers on pushes to `main` and on manual
# dispatch. Preview branches keep deploying to Vercel via the existing Vercel
# GitHub integration; this workflow only targets production on Azure.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs when a newer commit lands on main — no point pushing
# an older image after a newer one has already started.
concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: true

env:
  # Names of resources you provision once on Azure. See
  # docs/azure-deployment.md for the full setup walk-through.
  AZURE_RESOURCE_GROUP: rg-transcripts
  AZURE_CONTAINER_APP: transcripts
  AZURE_REGISTRY: transcripts.azurecr.io
  IMAGE_NAME: transcripts

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for federated OIDC auth to Azure — no client secret needed.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Federated identity: GitHub OIDC → Azure AD → ACR/Container Apps.
      # No long-lived service-principal secret stored in GitHub.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.AZURE_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.AZURE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.AZURE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}

      # Rolling-revision update. Container Apps brings up the new revision,
      # waits for the /api/health probe, then drains traffic from the old.
      - name: Deploy revision
        run: |
          az containerapp update \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.AZURE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            --revision-suffix sha-${{ steps.meta.outputs.tag }}

      - name: Show revision
        run: |
          az containerapp revision list \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?properties.active].{name:name, created:properties.createdTime, healthy:properties.healthState}" \
            -o table
